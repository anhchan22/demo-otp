spring:
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: ${APP_NAME:otp-demo}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        jdbc:
          time_zone: ${JPA_TIME_ZONE:UTC}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

otp:
  hmac-secret: ${OTP_HMAC_SECRET}
  rate-limit:
    window-seconds: ${OTP_RATE_LIMIT_WINDOW_SECONDS:600}
    max-send-per-window: ${OTP_MAX_SEND_PER_WINDOW:5}
  ip-rate-limit:
    window-seconds: ${OTP_IP_RATE_LIMIT_WINDOW_SECONDS:600}
    max-requests: ${OTP_IP_RATE_LIMIT_MAX_REQUESTS:20}
  ttl-seconds: ${OTP_TTL_SECONDS:300}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  dev-preview: ${OTP_DEV_PREVIEW}

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS}

app:
  flow-secret: ${FLOW_SECRET}
  flow-ttl-seconds: ${FLOW_TTL_SECONDS}
  cookie-secure: ${COOKIE_SECURE:false}

esms:
  enabled: ${ESMS_ENABLED}
  api-url: ${ESMS_API_URL}
  api-key: ${ESMS_API_KEY}
  secret-key: ${ESMS_SECRET_KEY}
  brand-name: ${ESMS_BRAND_NAME}
  sandbox: ${ESMS_SANDBOX}

zalo:
  enabled: ${ZALO_ENABLED}
  provider: ${ZALO_PROVIDER}
  oa-id: ${ZALO_OA_ID}
  access-token: ${ZALO_ACCESS_TOKEN}
  template-id: ${ZALO_TEMPLATE_ID}
